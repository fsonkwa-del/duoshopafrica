# Infrastructure de développement, accès loopback uniquement. Aucun environnement de production.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: duoshop
      POSTGRES_USER: duoshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duoshop -d duoshop"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
volumes:
  postgres-data:
