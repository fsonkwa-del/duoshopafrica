# Inventaire d'exemple (lot 1) : remplacer les adresses par celles de l'hébergeur retenu au
# Cameroun. Adresses WireGuard privées dans 10.66.0.0/24. Aucune valeur réelle ici.
[app]
app1 ansible_host=203.0.113.10 wg_address=10.66.0.1

[db]
db1 ansible_host=203.0.113.11 wg_address=10.66.0.2

[backup]
backup1 ansible_host=198.51.100.20 wg_address=10.66.0.3

[all:vars]
ansible_user=deploy
# Adresses autorisées en SSH (bureau de l'équipe), séparées par des virgules.
ssh_allowed_cidrs=192.0.2.0/24
