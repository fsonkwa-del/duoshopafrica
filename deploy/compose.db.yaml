# Production, machine « db » (lot 1, ADR 0009) : PostgreSQL 17 seul, archivage WAL continu par
# pgBackRest vers le second site. Écoute uniquement sur l'adresse WireGuard (WG_ADDRESS), en TLS
# obligatoire (certificat de l'autorité interne, généré par Ansible).
#   docker compose -f deploy/compose.db.yaml --env-file deploy/db.env up -d --build
name: duoshop-db
services:
  postgres:
    build: { context: ., dockerfile: db/Dockerfile }
    command: >-
      postgres -c archive_mode=on
      -c archive_command='pgbackrest --stanza=duoshop archive-push %p'
      -c wal_level=replica -c max_wal_senders=3
      -c listen_addresses='*'
      -c ssl=on -c ssl_cert_file=/etc/postgresql/tls/server.crt
      -c ssl_key_file=/etc/postgresql/tls/server.key
      -c ssl_min_protocol_version=TLSv1.2
    environment:
      POSTGRES_DB: duoshop
      POSTGRES_USER: duoshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    env_file: [db.env]
    ports:
      # Jamais 0.0.0.0 : seulement l'interface WireGuard (le pare-feu bloque le reste).
      - "${WG_ADDRESS:?WG_ADDRESS requis}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./db/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./tls:/etc/postgresql/tls:ro
      - ./tls/ca.crt:/etc/pgbackrest/backup-ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duoshop -d duoshop"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
