# pgBackRest (lot 1, ADR 0009) : dépôt S3 sur la machine « backup » (second site au Cameroun),
# chiffré côté client, joint en TLS vérifié par une autorité interne (backup-ca.crt), en plus du
# tunnel WireGuard. Les secrets viennent de l'environnement (db.env) :
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS,
#   PGBACKREST_REPO1_S3_ENDPOINT (nom couvert par le certificat de la machine « backup »).
# La phrase de chiffrement est conservée hors des deux sites : sans elle, aucune restauration.
[global]
repo1-type=s3
repo1-s3-bucket=duoshop-pgbackrest
repo1-s3-region=cm-douala
repo1-s3-uri-style=path
repo1-storage-ca-file=/etc/pgbackrest/backup-ca.crt
repo1-path=/duoshop
repo1-cipher-type=aes-256-cbc
# Rétention : 4 sauvegardes complètes hebdomadaires, différentielles entre elles. À aligner sur
# les durées de conservation validées (ADR 0010).
repo1-retention-full=4
repo1-retention-diff=7
process-max=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail

[duoshop]
pg1-path=/var/lib/postgresql/data
pg1-user=duoshop
