name: Foundations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: duoshop
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: duoshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U duoshop -d duoshop"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://duoshop:ci-test-only@localhost:5432/duoshop?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      # Flux sortants : tout hôte externe doit être déclaré (docs/compliance/flux-sortants.md).
      - run: pnpm check:outbound
      - run: pnpm db:deploy
      # Migrations réversibles (ADR 0008) : montée → descente → montée, schéma identique.
      - run: pnpm db:roundtrip
      - run: pnpm db:seed
      # En cas d'échec, les tests en erreur deviennent des annotations (lisibles sans connexion).
      - shell: bash
        run: |
          set +e
          pnpm test:db > test-db.log 2>&1
          status=$?
          cat test-db.log
          if [ "$status" -ne 0 ]; then
            # GitHub limite à 10 annotations par étape : un seul message multi-lignes.
            # Les erreurs SQL d'abord (journal du serveur PostgreSQL), puis le détail des premiers échecs.
            { docker logs "$(docker ps -q --filter ancestor=postgres:17.6-alpine)" 2>&1 | grep -E "ERROR|DETAIL|CONTEXT" | sed -E 's/^[0-9 :.-]+UTC \[[0-9]+\] //' | cut -c1-150 | sort | uniq -c | sort -rn | head -25
              sed -n '/failing tests:/,$p' test-db.log | grep -vE "^\s+at |node:internal|node_modules"; } | head -c 3500 > test-db.summary
            echo "::error title=test:db exit ${status}::$(sed 's/%/%25/g' test-db.summary | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Parcours navigateur (mobile + bureau, axe) sur les builds de production ci-dessus.
      - run: pnpm exec playwright install --with-deps chromium
      # En cas d'échec, les erreurs des serveurs (API, site) deviennent une annotation publique.
      - shell: bash
        run: |
          set +e
          pnpm test:e2e > e2e.log 2>&1
          status=$?
          cat e2e.log
          if [ "$status" -ne 0 ]; then
            { grep -E '"level":(40|50)' e2e.log | grep -v "payment webhook rejected" | cut -c1-600 | head -8
              grep -E "^\[WebServer\].*(Error|error)" e2e.log | cut -c1-300 | head -8; } | head -c 3500 > e2e.summary
            echo "::error title=e2e server errors::$(sed 's/%/%25/g' e2e.summary | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: .local/e2e-results
          retention-days: 7
  # Infrastructure (lots 1 et 8) : profils Compose valides, exposition limitée à Caddy,
  # playbook Ansible syntaxiquement correct, scripts shell vérifiés.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose profiles and exposure
        shell: bash
        run: |
          set -euo pipefail
          cd deploy
          cp staging.env.example staging.env
          cp zitadel.env.example zitadel.env
          touch db.env backup.env
          export POSTGRES_PASSWORD=x SITE_DOMAIN=a.example AUTH_DOMAIN=b.example MEDIA_DOMAIN=c.example \
            WEB_ORIGIN=https://a.example LOGIN_SESSION_COOKIE_SECRET=x DB_HOST=10.66.0.2 WG_ADDRESS=10.66.0.2
          for files in "-f compose.staging.yaml" \
                       "-f compose.staging.yaml -f compose.app.yaml -f compose.monitoring.yaml" \
                       "-f compose.db.yaml" "-f compose.backup.yaml"; do
            echo "== $files"
            docker compose $files --env-file staging.env config --format json --no-interpolate >/dev/null
            docker compose $files --env-file staging.env config --format json | node ../scripts/check-exposure.mjs
          done
      - name: Ansible syntax
        run: |
          pip install --quiet ansible-core==2.17.7
          ansible-galaxy collection install community.general --force >/dev/null
          ansible-playbook --syntax-check -i deploy/ansible/inventory.example.ini deploy/ansible/site.yml
      - name: Shell scripts
        run: shellcheck scripts/restore-drill.sh scripts/check-exposure-remote.sh
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Construit chaque cible du Dockerfile de staging (aucune publication d'image).
      - run: |
          for target in migrate api worker web; do
            docker build --file deploy/Dockerfile --target "$target" --tag "duoshop-$target:ci" .
          done
